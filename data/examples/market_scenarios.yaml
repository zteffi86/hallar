# Market Scenario Definitions for Hallar DSS
# These define different economic conditions under which scenarios are evaluated

market_scenarios:
  M1:
    name: "Optimistic"
    description: "Strong market conditions with low rates and high demand"
    probability: 0.20

    parameters:
      construction_cost_multiplier: 1.05
      interest_rate: 0.05
      property_price_growth: 0.03
      sales_velocity_months: 12
      inflation_rate: 0.025
      developer_default_multiplier: 0.5

  M2:
    name: "Base Case"
    description: "Normal market conditions representing most likely scenario"
    probability: 0.50

    parameters:
      construction_cost_multiplier: 1.15
      interest_rate: 0.07
      property_price_growth: 0.01
      sales_velocity_months: 18
      inflation_rate: 0.04
      developer_default_multiplier: 1.0

  M3:
    name: "Pessimistic"
    description: "Challenging market with higher costs and slower sales"
    probability: 0.25

    parameters:
      construction_cost_multiplier: 1.30
      interest_rate: 0.09
      property_price_growth: -0.02
      sales_velocity_months: 30
      inflation_rate: 0.06
      developer_default_multiplier: 2.0

  M4:
    name: "Crisis"
    description: "Severe economic downturn with market disruption"
    probability: 0.05

    parameters:
      construction_cost_multiplier: 1.50
      interest_rate: 0.12
      property_price_growth: -0.10
      sales_velocity_months: 48
      inflation_rate: 0.08
      developer_default_multiplier: 3.0
