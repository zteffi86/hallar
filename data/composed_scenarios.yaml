# Composed Scenarios for Hallar DSS
# Valid combinations of ownership, financing, byggingarrétt, and infrastructure

description: |
  Each composed scenario is a valid combination of:
  - Ownership structure (O1-O8)
  - Financing model (F1-F8)
  - Byggingarrétt disposition (B1-B6)
  - Infrastructure model (I1-I6)

composed_scenarios:
  S01:
    id: "S01"
    name: "City Direct Development"
    name_is: "Bein framkvæmd borgar"
    description: "City develops the entire project directly"
    components:
      ownership: "O1"
      financing: "F1"
      byggingarrettur: "N/A"
      infrastructure: "I1"
    counterparty: "city"
    default_probability: 0.0
    city_control_score: 100
    goal_scores:
      speed: 30
      affordability: 90
      quality: 85
      financial: 25
      risk: 20
      control: 100

  S02:
    id: "S02"
    name: "Market Sale to Developer"
    name_is: "Markaðssala til framkvæmdaraðila"
    description: "Sell byggingarrétt at market price to private developer"
    components:
      ownership: "O2"
      financing: "F2"
      byggingarrettur: "B1"
      infrastructure: "I2"
    counterparty: "developer_large"
    default_probability:
      min: 0.05
      likely: 0.08
      max: 0.12
    city_control_score: 10
    goal_scores:
      speed: 85
      affordability: 35
      quality: 55
      financial: 80
      risk: 50
      control: 10

  S03:
    id: "S03"
    name: "Discounted Sale + Affordability"
    name_is: "Afsláttarsala + hagkvæmni"
    description: "Sell byggingarrétt at discount for affordability commitments"
    components:
      ownership: "O2"
      financing: "F2"
      byggingarrettur: "B2"
      infrastructure: "I5"
    counterparty: "developer_large"
    default_probability:
      min: 0.05
      likely: 0.08
      max: 0.12
    city_control_score: 15
    affordability_commitment:
      minimum_pct: 0.30
      discount_depth: 0.25
      restriction_years: 30
    goal_scores:
      speed: 75
      affordability: 70
      quality: 55
      financial: 50
      risk: 45
      control: 15

  S04:
    id: "S04"
    name: "Pension Fund Direct"
    name_is: "Lífeyrissjóður beint"
